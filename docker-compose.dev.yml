services:
  postgres:
    image: postgres:16-alpine
    container_name: dogfood_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood_user
      POSTGRES_PASSWORD: dogfood_secure_password_2026
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - dogfood-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: dogfood_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://dogfood_user:dogfood_secure_password_2026@postgres:5432/dogfood
      JWT_SECRET: dogfood_dev_jwt_secret_key_12345
      SESSION_SECRET: dogfood_dev_session_secret_key_67890
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - postgres
    networks:
      - dogfood-dev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: dogfood_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
    volumes:
      - ./frontend/src:/app/src
    networks:
      - dogfood-dev-network

volumes:
  postgres_data_dev:

networks:
  dogfood-dev-network:
    driver: bridge

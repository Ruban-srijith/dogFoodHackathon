services:
  postgres:
    image: postgres:16-alpine
    container_name: dogfood_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dogfood}
      POSTGRES_USER: ${DB_USER:-dogfood_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dogfood_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dogfood_user} -d ${DB_NAME:-dogfood}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dogfood-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dogfood_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-dogfood_user}:${DB_PASSWORD:-dogfood_secure_password_2026}@postgres:5432/${DB_NAME:-dogfood}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dogfood}
      DB_USER: ${DB_USER:-dogfood_user}
      DB_PASSWORD: ${DB_PASSWORD:-dogfood_secure_password_2026}
      JWT_SECRET: ${JWT_SECRET:-dogfood_super_secure_jwt_secret_key_change_in_production_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SESSION_SECRET: ${SESSION_SECRET:-dogfood_session_secret_cookie_vault_key_2026}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@dogfood.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-DogfoodAdmin123!}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dogfood-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dogfood_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dogfood-internal

  nginx:
    image: nginx:1.25-alpine
    container_name: dogfood_nginx
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dogfood-internal

volumes:
  postgres_data:
    driver: local

networks:
  dogfood-internal:
    driver: bridge

name: Acceptance Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  acceptance-tests:
    name: Full Docker Compose Stack Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Environment File
        run: cp .env.example .env

      - name: Build and Start Application Stack
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          sleep 15

      - name: Verify Backend Health Endpoint
        run: |
          curl -s -f http://localhost:5000/api/health | grep '"status":"ok"'

      - name: Verify Frontend Web Delivery
        run: |
          curl -s -f http://localhost:5173/ | grep -i "html"

      - name: Collect Stack Logs on Failure
        if: failure()
        run: docker compose logs

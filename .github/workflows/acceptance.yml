name: DOGFOOD Acceptance Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  acceptance-tests:
    name: Full Docker Compose Acceptance Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Environment File
        run: cp .env.example .env

      - name: Build and Start Application Stack
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          sleep 15

      - name: Run Platform Healthcheck
        run: |
          bash ./scripts/healthcheck.sh localhost 8080 3000

      - name: Run End-to-End Acceptance Tests
        run: |
          docker compose exec -T backend npm run db:migrate
          docker compose exec -T backend npm run db:seed
          npm run test:acceptance
        env:
          ACCEPTANCE_BASE_URL: http://localhost:8080

      - name: Collect Stack Logs on Failure
        if: failure()
        run: docker compose logs

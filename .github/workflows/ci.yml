name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Test & Docker Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Backend Auth & RBAC Tests
        run: npm test

      - name: Lint Frontend
        run: npm run lint

      - name: Build Frontend
        run: npm run build

      - name: Verify Docker Builds
        run: |
          docker build -t backend:ci ./backend
          docker build -t frontend:ci ./frontend
